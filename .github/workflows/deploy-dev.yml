name: Deploy to DEV

# Dev branch -> deployment/dev/*.env (L40S). Keeps the branch name (Dev) and
# the environment/folder name (dev) mapped explicitly here instead of
# leaving it as tribal knowledge.
on:
  push:
    branches: [Dev]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      gemma-3-1b-it: ${{ steps.changes.outputs.gemma-3-1b-it }}
      medgemma-4b: ${{ steps.changes.outputs.medgemma-4b }}
      medgemma-27b: ${{ steps.changes.outputs.medgemma-27b }}
      common: ${{ steps.changes.outputs.common }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            gemma-3-1b-it:
              - 'models/gemma-3-1b-it/**'
              - 'deployment/dev/gemma-3-1b-it.env'
            medgemma-4b:
              - 'models/medgemma-4b/**'
              - 'deployment/dev/medgemma-4b.env'
            medgemma-27b:
              - 'models/medgemma-27b/**'
              - 'deployment/dev/medgemma-27b.env'
            common:
              - 'src/**'
              - 'docker/**'
              - 'scripts/**'

  deploy-gemma-3-1b-it:
    needs: detect-changes
    if: needs.detect-changes.outputs.gemma-3-1b-it == 'true' || needs.detect-changes.outputs.common == 'true'
    runs-on: [self-hosted, dev-gpu]
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Deploy gemma-3-1b-it to DEV
        run: ./scripts/deploy.sh gemma-3-1b-it dev

  deploy-medgemma-4b:
    needs: detect-changes
    if: needs.detect-changes.outputs.medgemma-4b == 'true' || needs.detect-changes.outputs.common == 'true'
    runs-on: [self-hosted, dev-gpu]
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Deploy medgemma-4b to DEV
        run: ./scripts/deploy.sh medgemma-4b dev

  deploy-medgemma-27b:
    needs: detect-changes
    if: needs.detect-changes.outputs.medgemma-27b == 'true' || needs.detect-changes.outputs.common == 'true'
    runs-on: [self-hosted, dev-gpu]
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Deploy medgemma-27b to DEV
        run: ./scripts/deploy.sh medgemma-27b dev
