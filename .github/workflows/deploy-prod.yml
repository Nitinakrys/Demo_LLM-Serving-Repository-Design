name: Deploy to PROD

# main branch -> deployment/prod/*.env (H200). Note the branch is called
# "main", not "prod" — the environment/folder is still named "prod" to
# match what's actually running there; this workflow is what makes that
# main -> prod mapping explicit instead of implicit tribal knowledge.
on:
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      gemma-4-31b-it: ${{ steps.changes.outputs.gemma-4-31b-it }}
      medgemma-1-5-4b-it: ${{ steps.changes.outputs.medgemma-1-5-4b-it }}
      medgemma-27b-it: ${{ steps.changes.outputs.medgemma-27b-it }}
      common: ${{ steps.changes.outputs.common }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            gemma-4-31b-it:
              - 'models/gemma-4-31b-it/**'
              - 'main/gemma-4-31b-it.env'
            medgemma-1-5-4b-it:
              - 'models/medgemma-1.5-4b-it/**'
              - 'main/medgemma-1.5-4b-it.env'
            medgemma-27b-it:
              - 'models/medgemma-27b-it/**'
              - 'main/medgemma-27b-it.env'
            common:
              - 'src/**'
              - 'docker/**'
              - 'scripts/**'

  deploy-gemma-4-31b-it:
    needs: detect-changes
    if: needs.detect-changes.outputs.gemma-4-31b-it == 'true' || needs.detect-changes.outputs.common == 'true'
    runs-on: [self-hosted, prod-gpu]
    environment: production    # requires approval — configure in repo Settings > Environments
    steps:
      - uses: actions/checkout@v4
      - name: Deploy gemma-4-31b-it to PROD
        run: ./scripts/deploy.sh gemma-4-31b-it main

  # Job id can't contain dots (GitHub Actions requirement) — the model
  # identifier itself (medgemma-1.5-4b-it, matching models/ and main/ paths)
  # keeps the dot; only the job id / output key swap it for a hyphen.
  deploy-medgemma-1-5-4b-it:
    needs: detect-changes
    if: needs.detect-changes.outputs.medgemma-1-5-4b-it == 'true' || needs.detect-changes.outputs.common == 'true'
    runs-on: [self-hosted, prod-gpu]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy medgemma-1.5-4b-it to PROD
        run: ./scripts/deploy.sh medgemma-1.5-4b-it main

  deploy-medgemma-27b-it:
    needs: detect-changes
    if: needs.detect-changes.outputs.medgemma-27b-it == 'true' || needs.detect-changes.outputs.common == 'true'
    runs-on: [self-hosted, prod-gpu]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy medgemma-27b-it to PROD
        run: ./scripts/deploy.sh medgemma-27b-it main
